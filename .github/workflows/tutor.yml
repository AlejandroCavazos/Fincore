name: Deploy AI tutor (Cloudflare Worker)

# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY.
# Until CLOUDFLARE_API_TOKEN exists the job only prints a notice and succeeds.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/tutor.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set yet; skipping the tutor deploy."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.HAS_TOKEN == 'true'
        run: npm install
        working-directory: worker
      - if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
